oter\">\u003cspan id=\"wordCount\">0 characters\u003c/span>\u003cbutton id=\"retry\" hidden>Retry saving\u003c/button>\u003cbutton id=\"deleteEntry\">Clear day\u003c/button>\u003c/div>\u003c/section>\u003c/section>\u003cfooter>COLORBAR DIARY \u003cspan>Every day has its own colors.\u003c/span>\u003c/footer>\u003c/main>\r\n\u003cdialog id=\"tagDialog\">\u003cdiv class=\"dialog-top\">\u003ch2 id=\"dialogTitle\">Add today’s tag\u003c/h2>\u003cbutton id=\"closeDialog\" aria-label=\"Close\">×\u003c/button>\u003c/div>\u003cdiv id=\"tagChoices\">\u003c/div>\u003cform id=\"tagForm\">\u003ch3 id=\"formTitle\">Create tag\u003c/h3>\u003cinput id=\"tagName\" placeholder=\"Tag name\" required maxlength=\"40\">\u003cselect id=\"tagParent\" aria-label=\"Parent tag\">\u003c/select>\u003cinput id=\"tagColor\" aria-label=\"Tag color\" type=\"color\" value=\"#849bda\">\u003cbutton type=\"submit\" class=\"primary\">Save tag\u003c/button>\u003cbutton type=\"button\" id=\"cancelEdit\" hidden>Cancel editing\u003c/button>\u003cdiv id=\"deleteTagArea\" hidden>\u003clabel>Move existing entries to \u003cselect id=\"deleteDestination\" aria-label=\"Destination for existing entries\">\u003c/select>\u003c/label>\u003cbutton type=\"button\" id=\"deleteTag\" class=\"danger\">Delete tag\u003c/button>\u003cp>Children become top-level tags. Entries are kept. A full backup is downloaded before deletion.\u003c/p>\u003c/div>\u003c/form>\u003c/dialog>\u003cdiv id=\"alarmNotice\" role=\"alert\" hidden>\u003cspan id=\"alarmNoticeText\">\u003c/span>\u003cbutton id=\"dismissAlarm\">Dismiss\u003c/button>\u003c/div>\u003cdiv id=\"toast\" role=\"status\">\u003c/div>\u003csection id=\"fileGate\" aria-label=\"Connect Markdown file\">\u003cdiv class=\"file-card\">\u003cselect class=\"language-picker\" aria-label=\"Language\">\u003coption value=\"en\">English\u003c/option>\u003coption value=\"zh-CN\">中文\u003c/option>\u003c/select>\u003ch2>colorbardiary_v4\u003c/h2>\u003cp>Choose your Markdown file in a local or locally synced cloud folder.\u003c/p>\u003cp>Your diary lives in the selected file. Browser storage only remembers access and preferences. Select the file again after clearing browser storage.\u003c/p>\u003cbutton id=\"chooseMain\">Choose file\u003c/button>\u003cbutton id=\"createMain\">New file\u003c/button>\u003cbutton id=\"reconnectMain\" hidden>Reconnect last file\u003c/button>\u003cbutton id=\"useProjectMain\" hidden>Use project file\u003c/button>\u003cbutton id=\"closeFileGate\" hidden>Back to diary\u003c/button>\u003cp id=\"fileMessage\">Choose an existing full Colorbar Diary Markdown file, or create a new one.\u003c/p>\u003csmall>App version v0 · Data format v4 · Offline, no background service needed\u003c/small>\u003c/div>\u003c/section>\u003cscript>/* Language is a browser preference; diary content and tag definitions are never translated. */\r\nfunction tagLabel(tag){const defaults={health:['身心健康','Wellbeing'],knee:['膝盖','Knee'],fever:['发烧','Fever'],work:['工作','Work'],family:['家庭','Family'],social:['社交','Social'],interest:['兴趣','Interests'],software:['软件开发','Software development'],thoughts:['碎碎念','Thoughts']};const p=defaults[tag.id];return window.ColorbarLanguage==='en'&&p&&tag.name===p[0]?p[1]:tag.name;}\r\nwindow.addEventListener('DOMContentLoaded',()=>{document.documentElement.lang=window.ColorbarLanguage||'en';for(const select of document.querySelectorAll('.language-picker')){select.value=window.ColorbarLanguage||'en';select.onchange=async()=>{const lang=select.value;try{if(typeof state!=='undefined'&&state&&typeof ensureSaved==='function'&&!await ensureSaved()){select.value=window.ColorbarLanguage;return;}}catch{select.value=window.ColorbarLanguage;return;}try{localStorage.setItem('colorbar-release-language',lang)}catch{}const url=new URL(location.href);url.searchParams.set('lang',lang);location.replace(url.href);};}});\r\n\r\nconst uiPairs=[[\"此浏览器不能直接读写本地文件，请使用 Windows Edge 或 Chrome；若仍不可用，请检查浏览器文件权限\",\"This browser cannot write local files directly. cspan class=\"local-state\">● 本地保存\u003c/span>\u003cbutton id=\"enableSound\" title=\"每次打开页面后点击启用声音\">🔈 启用提醒声音\u003c/button>\u003cselect class=\"language-picker\" aria-label=\"Language\">\u003coption value=\"en\">English\u003c/option>\u003coption value=\"zh-CN\">中文\u003c/option>\u003c/select>\u003cdiv class=\"file-actions\">\u003cspan id=\"mainFilename\">未连接主文件\u003c/span>\u003cbutton id=\"connectMain\">连接主文件\u003c/button>\u003cbutton id=\"draftBackup\">导出未保存草稿\u003c/button>\u003cbutton id=\"reimport\" title=\"外部修改所选主文件后，点此重新读取\">重新导入\u003c/button>\u003cbutton id=\"backup\">备份\u003c/button>\u003cbutton id=\"restore\" title=\"合并备份中尚不存在的日期，已有日期整天跳过\">恢复\u003c/button>\u003cinput id=\"restoreFile\" type=\"file\" accept=\".md,.json\" hidden>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"calendar-toolbar\">\u003ch2 id=\"monthTitle\">\u003c/h2>\u003cspan id=\"summary\" title=\"上下滚动，浏览连续的日子\">\u003c/span>\u003cdiv class=\"search-wrap\">\u003cspan>⌕\u003c/span>\u003cinput id=\"search\" placeholder=\"搜索片刻…\" aria-label=\"搜索正文\">\u003cspan id=\"filterHint\">全部标签\u003c/span>\u003c/div>\u003cdiv class=\"arrows\">\u003cbutton id=\"prev\" aria-label=\"上一期\">‹\u003c/button>\u003cbutton id=\"today\">今天\u003c/button>\u003cselect id=\"yearPicker\" aria-label=\"选择年份\">\u003c/select>\u003cselect id=\"monthPicker\" aria-label=\"选择月份\">\u003c/select>\u003cbutton id=\"next\" aria-label=\"下一期\">›\u003c/button>\u003c/div>\u003c/div>\u003cdiv id=\"calendar\">\u003c/div>\u003cdiv class=\"legend\">\u003cspan>□ 尚未记录\u003c/span>\u003cspan>▤ 多色代表不同记录\u003c/span>\u003cspan>● 文字日记\u003c/span>\u003c/div>\u003cdiv class=\"note\">\u003cspan>给今天留一点颜色\u003c/span>\u003cp>无需写得完整。一个感受、一件小事，都值得留下。\u003c/p>\u003c/div>\u003c/div>\r\n\u003caside id=\"tagPanel\" aria-label=\"标签与外观\">\u003cdiv class=\"panel-heading\">\u003cstrong>标签与外观\u003c/strong>\u003cbutton id=\"toggleTagPanel\" aria-expanded=\"true\" aria-controls=\"tagPanelContent diaryEditor\" title=\"收起标签栏和编辑区\">›\u003c/button>\u003c/div>\u003cdiv id=\"tagPanelContent\">\u003cdiv class=\"settings-line\">\u003clabel>主题 \u003cselect id=\"theme\">\u003coption value=\"blackboard\">黑板报\u003c/option>\u003coption value=\"sage\">鼠尾草\u003c/option>\u003coption value=\"ocean\">海盐蓝\u003c/option>\u003coption value=\"rose\">暮色玫瑰\u003c/option>\u003c/select>\u003c/label>\u003clabel class=\"opacity-control\">不透明度 \u003cinput id=\"opacity\" type=\"range\" min=\"35\" max=\"100\" value=\"90\">\u003coutput id=\"opacityValue\">\u003c/output>\u003c/label>\u003clabel class=\"opacity-control\">背景亮度 \u003cinput id=\"backgroundBrightness\" type=\"range\" min=\"0\" max=\"100\" step=\"1\" value=\"60\">\u003coutput id=\"backgroundBrightnessValue\">60%\u003c/output>\u003c/label>\u003cdiv class=\"background-controls\">\u003cbutton id=\"chooseBackground\" type=\"button\">选择背景图片\u003c/button>\u003cbutton id=\"resetBackground\" type=\"button\">恢复纯黑\u003c/button>\u003cinput id=\"backgroundFile\" type=\"file\" accept=\"image/png,image/jpeg,image/webp,image/gif,image/bmp,image/avif,image/svg+xml,.png,.jpg,.jpeg,.webp,.gif,.bmp,.avif,.svg\" hidden>\u003csmall id=\"backgroundName\">默认纯黑图片\u003c/small>\u003csmall>背景独立保存 · 图片失效则显示黑色\u003c/small>\u003c/div>\u003cspan class=\"tag-help\">勾选筛选 · 点击名称写记录 · ✓ 当天已填\u003c/span>\u003cbutton id=\"manage\">管理标签\u003c/button>\u003c/div>\u003cdiv id=\"filters\" aria-label=\"筛选和编辑共用标签\">\u003c/div>\u003c/div>\u003cdiv id=\"tagPanelResize\" role=\"separator\" aria-orientation=\"vertical\" aria-label=\"调整标签栏宽度\" tabindex=\"0\">\u003c/div>\u003cdiv id=\"editorResize\" role=\"separator\" aria-orientation=\"vertical\" aria-label=\"调整编辑栏宽度\" tabindex=\"0\" title=\"左右拖动调整编辑栏宽度\">\u003c/div>\u003c/aside>\u003csection class=\"editor\" id=\"diaryEditor\">\u003cdiv class=\"editor-heading\">\u003cspan>这一天\u003c/span>\u003cspan id=\"saveStatus\" role=\"status\">已就绪\u003c/span>\u003c/div>\u003ch2 id=\"dateTitle\">\u003c/h2>\u003cdiv id=\"dateSubtitle\">\u003c/div>\u003cdetails id=\"alarmDetails\" class=\"alarm-settings\">\u003csummary id=\"alarmSummary\">⏰ 添加日程提醒\u003c/summary>\u003clabel>事项（可选）\u003cinput id=\"alarmTitle\" maxlength=\"100\" placeholder=\"例如：项目会议\">\u003c/label>\u003clabel>提醒时间（本机时区）\u003cinput id=\"alarmTime\" type=\"datetime-local\" step=\"1\">\u003c/label>\u003clabel>提示音\u003cselect id=\"alarmSound\">\u003coption value=\"chime\">清脆铃声\u003c/option>\u003coption value=\"beep\">电子提示\u003c/option>\u003c/select>\u003c/label>\u003cdiv class=\"alarm-actions\">\u003cbutton id=\"saveAlarm\">保存提醒\u003c/button>\u003cbutton id=\"testAlarm\">试听 5 秒\u003c/button>\u003cbutton id=\"removeAlarm\">取消提醒\u003c/button>\u003c/div>\u003csmall>每天一个提醒。需保持页面运行并启用声音；关闭页面或电脑休眠时无法响铃，后台页面也可能延迟。\u003c/small>\u003c/details>\u003cdiv class=\"day-preview\" id=\"dayPreview\">\u003c/div>\u003cp class=\"editor-hint\">点击中间标签栏的名称，切换记录归属。\u003c/p>\u003cdiv id=\"activeRating\">\u003c/div>\u003clabel class=\"section-label\" for=\"body\">写下片刻 \u003cspan id=\"writingTag\">\u003c/span>\u003c/label>\u003ctextarea id=\"body\" placeholder=\"今天，有什么想留下的？\">\u003c/textarea>\u003cbutton id=\"completeRecord\" class=\"primary\">完成这条记录\u003c/button>\u003cdiv class=\"section-label\">当天记录 \u003cspan>最新编辑在前 · 点击可修改\u003c/span>\u003c/div>\u003cdiv id=\"entryItems\" class=\"record-list\">\u003c/div>\u003cdiv class=\"editor-footer\">\u003cspan id=\"wordCount\">0 字\u003c/span>\u003cbutton id=\"retry\" hidden>重试保存\u003c/button>\u003cbutton id=\"deleteEntry\">清空当天\u003c/button>\u003c/div>\u003c/section>\u003c/section>\u003cfooter>COLORBAR DIARY \u003cspan>每一天，都有自己的颜色。\u003c/span>\u003c/footer>\u003c/main>\r\n\u003cdialog id=\"tagDialog\">\u003cdiv class=\"dialog-top\">\u003ch2 id=\"dialogTitle\">添加今日标签\u003c/h2>\u003cbutton id=\"closeDialog\" aria-label=\"关闭\">×\u003c/button>\u003c/div>\u003cdiv id=\"tagChoices\">\u003c/div>\u003cform id=\"tagForm\">\u003ch3 id=\"formTitle\">创建标签\u003c/h3>\u003cinput id=\"tagName\" placeholder=\"标签名称\" required maxlength=\"40\">\u003cselect id=\"tagParent\" aria-label=\"父标签\">\u003c/select>\u003cinput id=\"tagColor\" aria-label=\"标签颜色\" type=\"color\" value=\"#849bda\">\u003cbutton type=\"submit\" class=\"primary\">保存标签\u003c/button>\u003cbutton type=\"button\" id=\"cancelEdit\" hidden>取消编辑\u003c/button>\u003cdiv id=\"deleteTagArea\" hidden>\u003clabel>删除后，已有记录归入 \u003cselect id=\"deleteDestination\" aria-label=\"删除标签后的记录归属\">\u003c/select>\u003c/label>\u003cbutton type=\"button\" id=\"deleteTag\" class=\"danger\">删除此标签\u003c/button>\u003cp>子标签保留并提升为一级；已有内容保留，操作前下载完整备份。\u003c/p>\u003c/div>\u003c/form>\u003c/dialog>\u003cdiv id=\"alarmNotice\" role=\"alert\" hidden>\u003cspan id=\"alarmNoticeText\">\u003c/span>\u003cbutton id=\"dismissAlarm\">知道了\u003c/button>\u003c/div>\u003cdiv id=\"toast\" role=\"status\">\u003c/div>\u003csection id=\"fileGate\" aria-label=\"连接 Markdown 主文件\">\u003cdiv class=\"file-card\">\u003cselect class=\"language-picker\" aria-label=\"Language\">\u003coption value=\"en\">English\u003c/option>\u003coption value=\"zh-CN\">中文\u003c/option>\u003c/select>\u003ch2>colorbardiary_v4\u003c/h2>\u003cp>选择你自己的 Markdown 主文件。可放在普通文件夹或已同步到本机的云盘目录。\u003c/p>\u003cp>日记保存在所选文件中。浏览器只记住文件入口与界面偏好，清理缓存后可以重新选择文件。\u003c/p>\u003cbutton id=\"chooseMain\">选择主文件\u003c/button>\u003cbutton id=\"createMain\">新建主文件\u003c/button>\u003cbutton id=\"reconnectMain\" hidden>继续连接上次文件\u003c/button>\u003cbutton id=\"useProjectMain\" hidden>使用项目主文件\u003c/button>\u003cbutton id=\"closeFileGate\" hidden>返回当前日记\u003c/button>\u003cp id=\"fileMessage\">首次使用请选择已有 Colorbar Diary 完整 Markdown，或新建一个文件。\u003c/p>\u003csmall>应用版本 v4 · 数据格式 v4 · 无需联网或后台服务\u003c/small>\u003c/div>\u003c/section>\u003cscript>/* Language is a browser preference; diary content and tag definitions are never translated. */\r\nfunction tagLabel(tag){const defaults={health:['身心健康','Wellbeing'],knee:['膝盖','Knee'],fever:['发烧','Fever'],work:['工作','Work'],family:['家庭','Family'],social:['社交','Social'],interest:['兴趣','Interests'],software:['软件开发','Software development'],thoughts:['碎碎念','Thoughts']};const p=defaults[tag.id];return window.ColorbarLanguage==='en'&&p&&tag.name===p[0]?p[1]:tag.name;}\r\nwindow.addEventListener('DOMContentLoaded',()=>{document.documentElement.lang=window.ColorbarLanguage||'en';for(const select of document.querySelectorAll('.language-picker')){select.value=window.ColorbarLanguage||'en';select.onchange=async()=>{const lang=select.value;try{if(typeof state!=='undefined'&&state&&typeof ensureSaved==='function'&&!await ensureSaved()){select.value=window.ColorbarLanguage;return;}}catch{select.value=window.ColorbarLanguage;return;}try{localStorage.setItem('colorbar-release-language',lang)}catch{}const url=new URL(location.href);url.searchParams.set('lang',lang);location.replace(url.href);};}});\r\n\r\nconst uiPairs=[[\"此浏览器不能直接读写本地文件，请使用 Windows Edge 或 Chrome；若仍不可用，请检查浏览器文件权限\",\"This browser cannot write local files directly. Use desktop Edge or Chrome and check file permissions.\"],[\"每天一个提醒。需保持页面运行并启用声音；关闭页面或电脑休眠时无法响铃，后台页面也可能延迟。\",\"One reminder per day. Keep the page open and sound enabled. Closed pages or sleeping computers cannot ring; background tabs may be delayed.\"],[\"首次使用请选择已有 Colorbar Diary 完整 Markdown，或新建一个文件。\",\"Choose an existing full Colorbar Diary Markdown file, or create a new one.\"],[\"选择你自己的 Markdown 主文件。可放在普通文件夹或已同步到本机的云盘目录。\",\"Choose your Markdown file in a local or locally synced cloud folder.\"],[\"日记保存在所选文件中。浏览器只记住文件入口与界面偏好，清理缓存后可以重新选择文件。\",\"Your diary lives in the selected file. Browser storage only remembers access and preferences. Select the file again after clearing browser storage.\"],[\"主文件已被外部编辑或同步更新，已停止保存。请先“导出未保存草稿”，再重新导入主文件\",\"The main file changed externally. Saving stopped. Export your unsaved draft, then reload the main file.\"],[\"请使用支持本地文件读写的 Windows Edge / Chrome 打开本文件。\",\"Open this file in desktop Edge or Chrome with local file access.\"],[\"后台数据已变化，为避免覆盖已暂停保存。请先复制当前未保存文字，再点击重新导入核对\",\"Data changed in the background. Saving paused. Copy your unsaved text, then reload to compare.\"],[\"当前窗口有未保存的改动，重新导入会以主文件为准、丢弃这些改动。继续？ rEnd=Math.min(9999,y+1);$('calendar').innerHTML='';renderCalendar();const sc=$('yearTimeline'),target=sc.querySelector('[data-month=\"'+month+'\"]');if(target)sc.scrollTop=target.offsetTop;}\r\nfunction renderYearTimeline(){const old=$('yearTimeline'),top=old?.scrollTop;if(!old||yearStart===undefined){const y=Number(month.slice(0,4));yearStart=Math.max(100,y-1);yearEnd=Math.min(9999,y+1);}let html='';for(let y=yearStart;y\u003c=yearEnd;y++)html+=yearSection(y);$('calendar').innerHTML='\u003cdiv id=\"yearTimeline\" aria-label=\"可跨年滚动的年度一览\">'+html+'\u003c/div>';const sc=$('yearTimeline');bindDays();const target=sc.querySelector('[data-year=\"'+Number(month.slice(0,4))+'\"]');sc.scrollTop=top??target?.offsetTop??0;\r\nsc.onscroll=()=>{if(!sc.isConnected)return;if(sc.scrollTop\u003c150&&yearStart>100){const height=sc.scrollHeight;sc.insertAdjacentHTML('afterbegin',yearSection(--yearStart));sc.scrollTop+=sc.scrollHeight-height;bindDays();}if(sc.scrollTop+sc.clientHeight>sc.scrollHeight-250&&yearEnd\u003c9999){sc.insertAdjacentHTML('beforeend',yearSection(++yearEnd));bindDays();}const sections=[...sc.querySelectorAll('.year-section')];const visible=sections.find(el=>el.offsetTop+el.offsetHeight>sc.scrollTop+20);if(visible){month=visible.dataset.year+'-'+month.slice(5);$('monthTitle').textContent=visible.dataset.year+' 年';syncPickers();}};\r\n}\r\n\r\nlet reminderAudio=null,alarmChecking=false;\r\nconst heardReminders=new Set();\r\n// Ignore historical reminders on load/import; never mark them as actually fired.\r\nfunction resetReminderSchedule(now=Date.now()){heardReminders.clear();for(const e of Object.values(state.entries)){const r=e.reminder;if(r&&Date.parse(r.at)\u003cnow)heardReminders.add(r.id);}if($('alarmNotice'))$('alarmNotice').hidden=true;}\r\nfunction reminderStatus(r){return r.firedAt?'已提醒':Date.parse(r.at)\u003cDate.now()?'已过期，不再提醒':'待提醒';}\r\nfunction alarmMark(e){const r=e?.reminder;return r?'\u003cspan class=\"alarm-mark '+(r.firedAt||Date.parse(r.at)\u {toast('请选择未来的提醒时间');return;}await unlockSound();mutateEntry(e=>e.reminder={id:crypto.randomUUID(),title:$('alarmTitle').value.trim(),at:date.toISOString(),sound:$('alarmSound').value});renderAlarm();if(await ensureSaved())toast('提醒已保存；请保持页面运行');};\r\n$('removeAlarm').onclick=async()=>{mutateEntry(e=>delete e.reminder);renderAlarm();await ensureSaved();};\r\n$('dismissAlarm').onclick=()=>{$('alarmNotice').hidden=true;};\r\nasync function checkReminders(now=Date.now()){if(!state||alarmChecking)return;for(const e of Object.values(state.entries)){const r=e.reminder;if(r&&!r.firedAt&&Date.parse(r.at)\u003cnow-2000)heardReminders.add(r.id);}const due=Object.entries(state.entries).filter(([,e])=>e.reminder&&!e.reminder.firedAt&&Date.parse(e.reminder.at)\u003c=now&&!heardReminders.has(e.reminder.id));if(!due.length)return;alarmChecking=true;try{let audioPlayed=false;for(const [d,e] of due){const r=e.reminder;heardReminders.add(r.id);r.firedAt=new Date(now).toISOString();if(!audioPlayed)audioPlayed=playReminder(r.sound);}changed();$('alarmNoticeText').textContent=due.map(([d,e])=>d+' '+(e.reminder.title||'日程提醒')+'（'+new Date(e.reminder.at).toLocaleString('zh-CN')+'）').join('；')+(audioPlayed?' · 提示音播放 5 秒':' · 未播放声音，请点击顶部启用提醒声音');$('alarmNotice').hidden=false;renderCalendar();renderAlarm();await ensureSaved();}finally{alarmChecking=false;}}\r\nsetInterval(()=>checkReminders(),1000);\r\nwindow.addEventListener('focus',()=>checkReminders());\r\ndocument.addEventListener('visibilitychange',()=>{if(!document.hidden)checkReminders();});\r\n\r\nlet panelWidth=240,panelCollapsed=false,editorWidth=null;\r\ntry{const prefs=JSON.parse(localStorage.getItem('colorbar-release-tag-panel')||'{}');panelWidth=Math.max(100,Math.min(480,Number(prefs.width)||240));panelCollapsed=prefs.collapsed===true;editorWidth=Number(prefs.editorWidth)||null;}catch{}\r\nfunction applyTagPanel(){const workspace=document.querySelector('.workspace');workspace.style.setProperty('--tag-panel-width',panelWidth+'px
